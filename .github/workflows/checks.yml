# Re-run the image checks (checks/) against images already pushed by build.yml,
# by digest, on GitHub-hosted runners: CPU only, no network, no GPU.
#
#   gh workflow run checks.yml -R ample-run/amplerun-images -f images=nb-jax@sha256:<64 hex>,nb-rapids@sha256:<64 hex>
name: checks

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated <name>@sha256:<digest> of pushed images (Jupyter-based: jupyter, nb-*)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'ample-run/amplerun-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          refs = [r.strip() for r in os.environ["IMAGES"].split(",") if r.strip()]
          for r in refs:
              assert re.fullmatch(r"(jupyter|nb-[a-z0-9-]+)@sha256:[0-9a-f]{64}", r), f"not a Jupyter image digest: {r}"
          print("matrix=" + json.dumps(refs))
          PY

  jupyter:
    needs: plan
    name: ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Verify Jupyter authentication (CPU only, no network)
        env:
          IMAGE: ghcr.io/ample-run/amplerun-${{ matrix.ref }}
        run: |
          docker pull "$IMAGE"
          python3 checks/check-jupyter-image.py "$IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
