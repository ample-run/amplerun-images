# AmpleRun images: build the images a dispatch names (from variants.json) on
# GitHub-hosted runners and publish PUBLIC packages at
# ghcr.io/ample-run/amplerun-<name>. Every image is pushed by digest first;
# tags are added only after its checks pass. Hosts pin by digest, never tag.
#
#   gh workflow run build.yml -R ample-run/amplerun-images -f images=serve-vllm,nb-pytorch
name: build

on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated names from variants.json, e.g. serve-vllm,nb-pytorch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ample-run/amplerun-

jobs:
  plan:
    if: github.repository == 'ample-run/amplerun-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
        run: node tools/plan-image-builds.mjs "$IMAGES" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Engine images (vLLM, PyTorch/CUDA) exceed the runner's default free
      # disk; drop preinstalled toolchains this workflow never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=main

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Verify Jupyter authentication (CPU only, no network)
        if: matrix.name == 'jupyter' || (startsWith(matrix.name, 'nb-') && !endsWith(matrix.name, '-rocm'))
        env:
          JUPYTER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$JUPYTER_IMAGE"
          python3 checks/check-jupyter-image.py "$JUPYTER_IMAGE"

      # --prefer-index=false copies the verified manifest as-is, so each tag
      # names exactly the digest that was checked.
      - name: Tag the verified digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$DIGEST"

      - name: Record digest
        run: |
          mkdir -p digests
          printf '{"engine":"%s","image":"%s","digest":"%s","tag":"sha-%s"}\n' \
            "${{ matrix.name }}" "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.name }}" \
            "${{ steps.build.outputs.digest }}" "${{ github.sha }}" > "digests/${{ matrix.name }}.json"
          cat "digests/${{ matrix.name }}.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90
